name: Evaporative redesign validation
on:
  push:
    branches: [design/evaporative-eln-family]
    paths: [.github/workflows/evaporative-redesign-build.yml, 'src/**', 'tools/evaporative/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evaporative-redesign-build
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  redesign:
    if: github.repository == 'CesarPetrescu/ElectricalAge' && github.ref == 'refs/heads/design/evaporative-eln-family'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DISPLAY: ':99'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply checksum-verified redesign sources
        run: |
          mkdir -p build
          if test -d .github/evaporative-redesign-seed; then
            python - <<'PY'
          import pathlib,base64,gzip,hashlib
          root=pathlib.Path('.github/evaporative-redesign-seed')
          encoded=''.join(p.read_text().strip() for p in sorted(root.glob('*.b64')))
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='bfb74608c8edc6a079774b0c0c38e9faef62342b69858642db5e13ef3bcc1252','Redesign source checksum mismatch'
          pathlib.Path('/tmp/redesign.patch').write_bytes(patch)
          PY
            git apply --check /tmp/redesign.patch
            git apply /tmp/redesign.patch
            rm -r .github/evaporative-redesign-seed
            rm .github/workflows/evaporative-design-workspace.yml
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/evaporative-cooler.yml')
          t=p.read_text()
          t=t.replace("['world','world-spin','held-model','ui-wet','ui-dry','ui-interlock']", "['world','world-spin','held-model','ui-wet','ui-dry','ui-interlock','ui-details','ui-small','ui-scale1','ui-scale3','family','orientations']")
          p.write_text(t)
          PY
      - name: Generate actual Blender source, game assets and family comparison
        run: |
          python -m pip install bpy==5.2.0
          python tools/evaporative/build_model.py --root . 2>&1 | tee build/evaporative-model.log
          find artwork/evaporative_cooler -type f -name '*.blend[0-9]*' -delete
          python tools/evaporative/verify_assets.py | tee build/evaporative-asset-check.log
          mkdir -p artwork/evaporative_cooler/review
          cp build/evaporative-renders/*.png artwork/evaporative_cooler/review/
      - name: Build with regenerated translations and data
        run: |
          bash tools/evaporative/test-core.sh | tee build/evaporative-core-tests.log
          ./gradlew generateLangFiles runData build --stacktrace 2>&1 | tee build/evaporative-build.log
      - name: Commit generated implementation to isolated design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find artwork/evaporative_cooler -type f -name '*.blend[0-9]*' -delete
          git add -A -- src tools/evaporative artwork/evaporative_cooler docs .github
          if ! git diff --cached --quiet; then
            git commit -m 'Restyle evaporative cooling as classic ELN heatsink family with compact native controls'
            git push origin HEAD:refs/heads/design/evaporative-eln-family
          fi
      - name: Headless native-client display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xserver-xorg-video-dummy xserver-xorg-core x11-xserver-utils libgl1-mesa-dri mesa-utils
          sudo tee /tmp/evap-dummy.conf >/dev/null <<'XORG'
          Section "Monitor"
            Identifier "Monitor0"
            HorizSync 28.0-90.0
            VertRefresh 48.0-80.0
          EndSection
          Section "Device"
            Identifier "Card0"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Screen"
            Identifier "Screen0"
            Device "Card0"
            Monitor "Monitor0"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1280x1024"
              Virtual 1280 1024
            EndSubSection
          EndSection
          XORG
          sudo nohup Xorg :99 -config /tmp/evap-dummy.conf -logfile /tmp/evap-xorg.log -noreset -nolisten tcp -ac > /tmp/evap-xorg.stdout 2>&1 &
          for i in $(seq 1 30); do xset -display :99 q >/dev/null 2>&1 && break; sleep 1; done
          xset -display :99 q >/dev/null
          glxinfo -B
      - name: Disposable test world
        run: |
          mkdir -p run/server run/client/saves build/smoke-artifacts
          echo eula=true > run/server/eula.txt
          cat > run/server/server.properties <<'PROPS'
          online-mode=false
          max-tick-time=-1
          level-type=minecraft\:flat
          generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":63}],"biome":"minecraft:plains"}
          PROPS
          printf 'onboardAccessibility:false\nnarrator:0\nguiScale:2\n' > run/client/options.txt
      - name: Live server cooling, water, capabilities and fault regressions
        run: timeout --signal=TERM --kill-after=30s 12m ./gradlew runServer -PsmokeTest=evaporative-place -q 2>&1 | tee build/smoke-artifacts/evaporative-server-place.log
      - name: Saved-world restart in a separate JVM
        run: |
          cp -r run/server/world run/client/saves/evaporative
          timeout --signal=TERM --kill-after=30s 12m ./gradlew runServer -PsmokeTest=evaporative-restart -q 2>&1 | tee build/smoke-artifacts/evaporative-server-restart.log
      - name: Native client controls, viewport sizes and cooler-family gallery
        run: timeout --signal=TERM --kill-after=30s 12m ./gradlew runClient -PsmokeClient=evaporative -q 2>&1 | tee build/smoke-artifacts/evaporative-client.log
      - name: Require complete runtime checks and visual evidence
        run: |
          python - <<'PY'
          import json,pathlib
          for suite in ['evaporative-place','evaporative-restart','evaporative-client']:
              data=json.loads(pathlib.Path(f'build/smoke-artifacts/contracts/{suite}.json').read_text())
              assert data['complete'] and data['results'] and data['failures']==0,suite
              assert all(r['status']=='passed' for r in data['results']),suite
              print(suite,len(data['results']),'passed')
          for name in ['world','world-spin','held-model','ui-wet','ui-dry','ui-interlock','ui-details','ui-small','ui-scale1','ui-scale3','family','orientations']:
              assert pathlib.Path(f'run/client/screenshots/evaporative-{name}.png').stat().st_size>10000,name
          PY
      - name: Export reviewable working source and identity
        if: always()
        run: |
          mkdir -p build/evaporative-artifacts
          git rev-parse HEAD > build/evaporative-artifacts/source-commit.txt
          git status --short > build/evaporative-artifacts/working-tree-status.txt
          git diff --binary > build/evaporative-artifacts/uncommitted.patch
          git archive --format=zip --output=build/evaporative-artifacts/ElectricalAge-redesign-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaporative-redesign-reviewed-build
          path: |
            build/evaporative-artifacts/
            build/evaporative-*.log
            build/evaporative-renders/
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
            build/smoke-artifacts/
            artwork/evaporative_cooler/
            run/server/logs/
            run/client/logs/
            run/client/screenshots/evaporative-*.png
          retention-days: 14
          if-no-files-found: error
