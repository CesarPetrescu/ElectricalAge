name: Re-Wired baseline

on:
  push:
    branches:
      - ci/rewired-baseline-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewired-baseline
  cancel-in-progress: true

jobs:
  baseline:
    name: Build and smoke-test Re-Wired snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout baseline harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact Re-Wired source
        uses: actions/checkout@v4
        with:
          repository: brambora69123/electrical-age-rewired
          ref: 3a0088b384aa4111c3a7f984d4cbc5f4ff142ed9
          path: rewired
          fetch-depth: 1

      - name: Apply dedicated-server side-safety patch
        working-directory: rewired
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check ../harness/porting/patches/0001-fix-dedicated-server-client-state.patch
          git apply ../harness/porting/patches/0001-fix-dedicated-server-client-state.patch
          git diff --check
          git diff --stat | tee baseline-patches.log

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            rewired/*.gradle
            rewired/gradle.properties
            rewired/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xserver-utils mesa-utils

      - name: Record environment
        working-directory: rewired
        shell: bash
        run: |
          set -euxo pipefail
          java -version 2>&1 | tee baseline-java.log
          git rev-parse HEAD | tee baseline-commit.log
          sha256sum gradle/wrapper/gradle-wrapper.jar | tee baseline-wrapper.log
          xrandr --version 2>&1 | tee baseline-xrandr-version.log

      - name: Set up decompiled workspace
        working-directory: rewired
        shell: bash
        run: |
          set -o pipefail
          ./gradlew setupDecompWorkspace --no-daemon --stacktrace 2>&1 | tee baseline-setup.log

      - name: Clean build
        id: build
        working-directory: rewired
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee baseline-build.log

      - name: Dedicated-server startup smoke test
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: rewired
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run run/server
          printf 'eula=true\n' > run/eula.txt
          printf 'eula=true\n' > run/server/eula.txt
          : > baseline-server.log

          setsid ./gradlew runServer --no-daemon --stacktrace > baseline-server.log 2>&1 &
          pid=$!
          ready=0

          for _ in $(seq 1 240); do
            if grep -Eqi 'Done \([^)]*\)!|Electrical Age server started' baseline-server.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -INT -- "-$pid" 2>/dev/null || true
          sleep 5
          kill -TERM -- "-$pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          find run -type f -name 'latest.log' -print -exec tail -n 200 {} \; >> baseline-server.log 2>/dev/null || true
          tail -n 250 baseline-server.log

          if [[ "$ready" -ne 1 ]]; then
            echo 'Dedicated server did not reach the ready state.' >&2
            exit 1
          fi

      - name: Client startup smoke test under Xvfb
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: rewired
        shell: bash
        env:
          ALSOFT_DRIVERS: null
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          rm -rf run/logs run/crash-reports
          : > baseline-client.log
          : > baseline-xdisplay.log

          setsid xvfb-run -a -s '-screen 0 1280x720x24 -ac +extension GLX +render -noreset' \
            bash -lc 'xrandr --query > baseline-xdisplay.log 2>&1; glxinfo -B >> baseline-xdisplay.log 2>&1 || true; exec ./gradlew runClient --no-daemon --stacktrace' \
            > baseline-client.log 2>&1 &
          pid=$!
          ready=0

          for _ in $(seq 1 300); do
            if grep -Eqi 'Forge Mod Loader has successfully loaded [0-9]+ mods' baseline-client.log 2>/dev/null && \
               grep -Eqi 'Sound engine started|OpenAL initialized|Created: [0-9]+x[0-9]+ textures-atlas' baseline-client.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -INT -- "-$pid" 2>/dev/null || true
          sleep 5
          kill -TERM -- "-$pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          cat baseline-xdisplay.log || true
          find run -type f -name 'latest.log' -print -exec tail -n 250 {} \; >> baseline-client.log 2>/dev/null || true
          tail -n 300 baseline-client.log

          if [[ "$ready" -ne 1 ]]; then
            echo 'Client did not finish Forge initialization and resource/audio startup.' >&2
            exit 1
          fi

      - name: List outputs
        if: always()
        working-directory: rewired
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort | tee baseline-artifacts.log || true

      - name: Upload baseline logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewired-baseline-logs
          path: |
            rewired/baseline-*.log
            rewired/run/**/crash-reports/*.txt
            rewired/run/crash-reports/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload built jars
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rewired-baseline-jars
          path: rewired/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
