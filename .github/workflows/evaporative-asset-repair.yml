name: EC-240 binary asset repair
on:
  push:
    branches: [feature/evaporative-cooler-20260907]
    paths: ['.github/workflows/evaporative-asset-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'CesarPetrescu/ElectricalAge' && github.ref == 'refs/heads/feature/evaporative-cooler-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/evaporative-cooler-20260907
          fetch-depth: 0
      - name: Restore the original verified GLB and protect binary attributes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('artwork/evaporative_cooler/evaporativecooler.glb')
          data=p.read_bytes()
          bad='6e5a1501feb18e045f907df43b33b35d91f2b2d4819b24e9619973110dc1252e'
          good='5667c6263e55cd2d20af5b3865d6d86dedbc28e98c50261fe8d44a1108300bf9'
          digest=hashlib.sha256(data).hexdigest()
          assert digest in (bad,good), 'Unexpected GLB contents; refuse to modify'
          if digest==bad:
              assert len(data)==529007 and data[114764]==10
              data=data[:114764]+b'\r'+data[114764:]
              assert hashlib.sha256(data).hexdigest()==good
              p.write_bytes(data)
          p=Path('.gitattributes')
          text=p.read_text()
          rule='*.[gG][lL][bB]          binary'
          if rule not in text:p.write_text(text.rstrip()+'\n\n# Binary glTF contains packed PNG signatures; never normalize its line endings.\n'+rule+'\n')
          PY
      - name: Add dependency-free committed-asset validation
        run: |
          cat > tools/evaporative/verify_assets.py <<'PY'
          """Check committed model integrity without requiring Blender or a graphical display."""
          from pathlib import Path
          import hashlib
          import json
          import struct
          import subprocess

          ROOT = Path(__file__).resolve().parents[2]
          ASSETS = ROOT / "artwork/evaporative_cooler"
          GAME = ROOT / "src/main/resources/assets/eln/model/evaporativecooler"


          def check() -> None:
              manifest = json.loads((ASSETS / "manifest.json").read_text())
              for path, key in [(GAME / "evaporativecooler.obj", "obj_sha256"),
                                (GAME / "atlas.png", "atlas_sha256"),
                                (ROOT / "tools/evaporative/build_model.py", "generator_sha256")]:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == manifest[key], str(path)
              data = (ASSETS / "evaporativecooler.glb").read_bytes()
              magic, version, total = struct.unpack_from("<4sII", data)
              assert magic == b"glTF" and version == 2 and total == len(data), "GLB header/length corrupted"
              offset = 12
              chunks = []
              while offset < total:
                  size, kind = struct.unpack_from("<II", data, offset)
                  assert size % 4 == 0 and offset + 8 + size <= total, "Invalid GLB chunk"
                  chunks.append((kind, data[offset + 8:offset + 8 + size]))
                  offset += 8 + size
              assert offset == total and len(chunks) == 2
              assert chunks[0][0] == 0x4E4F534A and chunks[1][0] == 0x004E4942
              scene = json.loads(chunks[0][1])
              binary = chunks[1][1]
              assert scene["animations"] and scene["meshes"], "Missing model or animation"
              assert len(scene["buffers"]) == 1 and scene["buffers"][0]["byteLength"] <= len(binary)
              for view in scene["bufferViews"]:
                  assert view["buffer"] == 0
                  assert view.get("byteOffset", 0) + view["byteLength"] <= len(binary)
              for image in scene["images"]:
                  assert "bufferView" in image and image["mimeType"] == "image/png", "Texture must be packed"
                  view = scene["bufferViews"][image["bufferView"]]
                  start = view.get("byteOffset", 0)
                  assert binary[start:start + 8] == b"\x89PNG\r\n\x1a\n", "Packed PNG signature corrupted"
              if (ROOT / ".git").exists():
                  attrs = subprocess.check_output(["git", "check-attr", "text", "--", "artwork/evaporative_cooler/evaporativecooler.glb"], cwd=ROOT, text=True)
                  assert attrs.strip().endswith(": unset"), "GLB must be marked binary in .gitattributes"
              print(f"Asset integrity passed: {manifest['triangles']} triangles, {len(scene['animations'])} animation(s), packed PNG, valid GLB chunks and source/game hashes.")


          if __name__ == "__main__":
              check()
          PY
          python tools/evaporative/verify_assets.py
      - name: Commit repair to feature branch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/evaporative-asset-repair.yml
          git add .gitattributes artwork/evaporative_cooler/evaporativecooler.glb tools/evaporative/verify_assets.py
          git diff --cached --check
          git commit -m 'Preserve binary GLB export and validate embedded textures, animation and asset hashes'
          git push origin HEAD:refs/heads/feature/evaporative-cooler-20260907
      - name: Verify exact committed bytes and export source
        run: |
          python tools/evaporative/verify_assets.py
          mkdir -p build/asset-repair
          git show HEAD:artwork/evaporative_cooler/evaporativecooler.glb > build/asset-repair/evaporativecooler.glb
          echo '5667c6263e55cd2d20af5b3865d6d86dedbc28e98c50261fe8d44a1108300bf9  build/asset-repair/evaporativecooler.glb' | sha256sum -c
          git archive --format=zip --output=build/asset-repair/ElectricalAge-source.zip HEAD
          git rev-parse HEAD > build/asset-repair/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evaporative-binary-asset-repair
          path: build/asset-repair/
          if-no-files-found: error
          retention-days: 14
