name: Survival recipes and relocation contracts
on:
  push:
    branches: [qa/survival-runtime-2026-09-08]
    paths: [.github/workflows/playtest-survival.yml, src/main/kotlin/mods/eln/devtest/SurvivalCampaignChecks.kt]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  survival:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - name: Compile QA instrumentation and verify fixed-core regressions
        run: |
          git rev-parse HEAD > campaign-source-commit.txt
          ./gradlew --no-daemon build 2>&1 | tee campaign-build.log
      - name: Isolated survival-mode fixture world
        run: |
          mkdir -p run/server
          echo eula=true > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          server-ip=127.0.0.1
          online-mode=false
          gamemode=survival
          spawn-protection=0
          max-tick-time=120000
          level-type=minecraft\:flat
          generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":63}],"biome":"minecraft:plains"}
          EOF
      - name: Execute live crafting and real block-break transactions
        env:
          JAVA_TOOL_OPTIONS: '-Deln.campaign=survival'
        run: timeout --signal=TERM --kill-after=30s 10m ./gradlew --no-daemon runServer 2>&1 | tee campaign-server.log
      - name: Require complete runtime evidence
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('build/smoke-artifacts/contracts/survival-campaign.json')
          d=json.loads(p.read_text())
          assert d['complete'] and len(d['results']) > 100 and d['failures']==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-campaign-results
          retention-days: 14
          path: |
            campaign-source-commit.txt
            campaign-*.log
            build/smoke-artifacts/
            build/test-results/
            run/server/logs/
            run/server/crash-reports/
