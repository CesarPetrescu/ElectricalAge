name: Natural-resource survival starter
on:
  push:
    branches: [qa/survival-runtime-2026-09-08]
    paths: [.github/workflows/playtest-natural-starter.yml, src/main/kotlin/mods/eln/devtest/NaturalStarterChecks.kt]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - name: Build exact QA instrumentation with the unchanged production core
        run: |
          git rev-parse HEAD > source-commit.txt
          ./gradlew --no-daemon build 2>&1 | tee natural-build.log
      - name: Fresh naturally generated terrain, never a prepopulated fixture inventory
        run: |
          mkdir -p run/server
          echo eula=true > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          server-ip=127.0.0.1
          online-mode=false
          gamemode=survival
          difficulty=peaceful
          spawn-protection=0
          max-tick-time=300000
          level-type=minecraft\:normal
          level-seed=12345
          generate-structures=true
          view-distance=5
          simulation-distance=5
          EOF
      - name: Mine natural blocks, pay actual recipes, wait for real smelting and resin collection
        env:
          JAVA_TOOL_OPTIONS: '-Deln.campaign=nature'
        run: timeout --signal=TERM --kill-after=30s 45m ./gradlew --no-daemon runServer 2>&1 | tee natural-server.log
      - name: Require complete progression and a resource journal
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('build/smoke-artifacts/contracts')
          d=json.loads((root/'natural-survival-starter.json').read_text())
          j=json.loads((root/'natural-starter-journal.json').read_text())
          assert d['complete'] and d['failures']==0
          assert any(x['action']=='natural-resource-crafting-chain-complete' for x in j)
          assert any(x['action']=='mine-natural-block' for x in j)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural-survival-starter-results
          retention-days: 14
          path: |
            source-commit.txt
            natural-*.log
            build/test-results/
            build/smoke-artifacts/
            run/server/logs/
            run/server/crash-reports/
            run/server/world/level.dat
            run/server/world/region/
            run/server/world/data/
