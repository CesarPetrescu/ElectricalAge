name: Evaporative cooler

on:
  workflow_call:
  push:
    branches: [feature/evaporative-cooler-20260907]
    paths: ['.github/workflows/evaporative-cooler.yml', 'src/**', 'tools/evaporative/**']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: evaporative-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: EC-240 build, save/restart and native UI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check committed model integrity without modifying the branch
        run: python tools/evaporative/verify_assets.py
      - name: Numerical regression and Minecraft build
        run: |
          mkdir -p build
          bash tools/evaporative/test-core.sh | tee build/evaporative-core-tests.log
          ./gradlew build --stacktrace 2>&1 | tee build/evaporative-build.log
      - name: Headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xserver-xorg-video-dummy xserver-xorg-core x11-xserver-utils libgl1-mesa-dri mesa-utils
          sudo tee /tmp/evap-dummy.conf >/dev/null <<'XORG'
          Section "Monitor"
            Identifier "Monitor0"
            HorizSync 28.0-90.0
            VertRefresh 48.0-80.0
          EndSection
          Section "Device"
            Identifier "Card0"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Screen"
            Identifier "Screen0"
            Device "Card0"
            Monitor "Monitor0"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1280x1024"
              Virtual 1280 1024
            EndSubSection
          EndSection
          XORG
          sudo nohup Xorg :99 -config /tmp/evap-dummy.conf -logfile /tmp/evap-xorg.log -noreset -nolisten tcp -ac > /tmp/evap-xorg.stdout 2>&1 &
          for i in $(seq 1 30); do xset -display :99 q >/dev/null 2>&1 && break; sleep 1; done
          xset -display :99 q >/dev/null
          glxinfo -B
      - name: Disposable test world
        run: |
          mkdir -p run/server run/client/saves build/smoke-artifacts
          echo eula=true > run/server/eula.txt
          cat > run/server/server.properties <<'PROPS'
          online-mode=false
          max-tick-time=-1
          level-type=minecraft\:flat
          generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":63}],"biome":"minecraft:plains"}
          PROPS
          printf 'onboardAccessibility:false\nnarrator:0\nguiScale:2\n' > run/client/options.txt
      - name: Live power, capabilities, buckets and failure modes
        run: timeout --signal=TERM --kill-after=30s 12m ./gradlew runServer -PsmokeTest=evaporative-place -q 2>&1 | tee build/smoke-artifacts/evaporative-server-place.log
      - name: Real saved-world restart in a separate JVM
        run: |
          cp -r run/server/world run/client/saves/evaporative
          timeout --signal=TERM --kill-after=30s 12m ./gradlew runServer -PsmokeTest=evaporative-restart -q 2>&1 | tee build/smoke-artifacts/evaporative-server-restart.log
      - name: Actual native renderer and UI interactions
        run: timeout --signal=TERM --kill-after=30s 12m ./gradlew runClient -PsmokeClient=evaporative -q 2>&1 | tee build/smoke-artifacts/evaporative-client.log
      - name: Require complete, passing runtime reports and screenshots
        run: |
          python - <<'PY'
          import json,pathlib
          for suite in ['evaporative-place','evaporative-restart','evaporative-client']:
              data=json.loads(pathlib.Path(f'build/smoke-artifacts/contracts/{suite}.json').read_text())
              assert data['complete'] and data['results'] and data['failures']==0, suite
              assert all(r['status']=='passed' for r in data['results']), suite
              print(suite, len(data['results']), 'passed')
          for name in ['world','world-spin','held-model','ui-wet','ui-dry','ui-interlock','ui-details','ui-small','ui-scale1','ui-scale3','family','orientations']:
              assert pathlib.Path(f'run/client/screenshots/evaporative-{name}.png').stat().st_size>10000,name
          PY
      - name: Export source identity
        if: always()
        run: |
          mkdir -p build/evaporative-artifacts
          git archive --format=zip --output=build/evaporative-artifacts/ElectricalAge-evaporative-source.zip HEAD
          git rev-parse HEAD > build/evaporative-artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaporative-feature-build
          path: |
            build/evaporative-artifacts/
            build/evaporative-*.log
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
            build/smoke-artifacts/
            artwork/evaporative_cooler/
            run/server/logs/
            run/client/logs/
            run/client/screenshots/evaporative-*.png
          retention-days: 14
          if-no-files-found: error
