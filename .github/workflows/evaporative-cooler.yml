name: Evaporative cooler development

on:
  push:
    branches: [feature/evaporative-cooler-20260907]
    paths: ['.github/workflows/evaporative-cooler.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Prepare source and Blender workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export repository and Blender Python distribution
        run: |
          mkdir -p /tmp/eln-workspace/wheels
          git archive --format=zip --output=/tmp/eln-workspace/ElectricalAge-source.zip HEAD
          python -m pip download --only-binary=:all: --dest /tmp/eln-workspace/wheels bpy==5.2.0
          python -m pip --version > /tmp/eln-workspace/toolchain.txt
          git rev-parse HEAD >> /tmp/eln-workspace/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evaporative-development-workspace
          path: /tmp/eln-workspace/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
