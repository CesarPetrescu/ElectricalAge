name: Evaporative cooler development

on:
  push:
    branches: [feature/evaporative-cooler-20260907]
    paths: ['.github/workflows/evaporative-cooler.yml', 'src/**', 'tools/evaporative/**']
  workflow_dispatch:

concurrency:
  group: evaporative-cooler-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Blender assets, model regression and Minecraft build
    if: github.repository == 'CesarPetrescu/ElectricalAge' && github.ref == 'refs/heads/feature/evaporative-cooler-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply checksum-verified feature source
        shell: bash
        run: |
          if test -d .github/evaporative-seed; then
            python - <<'PY'
          import pathlib, base64, gzip, hashlib
          root = pathlib.Path('.github/evaporative-seed')
          encoded = ''.join(p.read_text().strip() for p in sorted(root.glob('*.b64')))
          # Correct one identified transport transcription before validating the complete source hash.
          encoded = encoded.replace('KjuMU1tipR', 'KjuMU1ipR')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = 'dddd9aca40d104e505c72c396fb23eecf668b918ed283e77146ccb1b440a3ebc'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Feature source checksum mismatch'
          pathlib.Path('/tmp/evaporative.patch').write_bytes(patch)
          PY
            git apply --check /tmp/evaporative.patch
            git apply /tmp/evaporative.patch
            rm -r .github/evaporative-seed
            python - <<'PY'
          from pathlib import Path
          p = Path('src/test/java/mods/eln/transparentnode/evaporative/EvaporationModelTest.java')
          p.write_text('''package mods.eln.transparentnode.evaporative;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import org.junit.runners.Parameterized;
          import java.util.Collection;
          @RunWith(Parameterized.class)
          public class EvaporationModelTest {
              @Parameterized.Parameters(name="{0}") public static Collection<Object[]> cases() {
                  return EvaporationRegression.cases().stream().map(c -> new Object[]{c.name(),c.body()}).toList();
              }
              private final Runnable body;
              public EvaporationModelTest(String name, Runnable body) { this.body = body; }
              @Test public void regression() { body.run(); }
          }
          ''')
          PY
          fi
      - name: Install pinned Blender Python distribution
        run: python -m pip install bpy==5.2.0
      - name: Generate original Blender model and renders
        run: python tools/evaporative/build_model.py --root .
      - name: Run tick-independent numerical and control regression
        run: bash tools/evaporative/test-core.sh | tee build/evaporative-core-tests.log
      - name: Commit implementation and generated model to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find artwork/evaporative_cooler -name '*.blend1' -delete
          git add src tools/evaporative artwork/evaporative_cooler docs/evaporative-cooler.md
          git add -u .github/evaporative-seed || true
          if ! git diff --cached --quiet; then
            git commit -m 'Implement EC-240 evaporative heat sink, controls, regression tests and Blender assets'
            git push origin HEAD:refs/heads/feature/evaporative-cooler-20260907
          fi
      - name: Build mod and run NeoForge unit tests
        run: ./gradlew generateLangFiles runData build --stacktrace 2>&1 | tee build/evaporative-build.log
      - name: Persist generated translations and data
        if: success()
        run: |
          git add src/main/resources src/generated/resources
          if ! git diff --cached --quiet; then
            git commit -m 'Generate EC-240 translations, recipes and item models'
            git push origin HEAD:refs/heads/feature/evaporative-cooler-20260907
          fi
      - name: Export reviewable source
        if: always()
        run: |
          mkdir -p build/evaporative-artifacts
          git archive --format=zip --output=build/evaporative-artifacts/ElectricalAge-evaporative-source.zip HEAD
          git rev-parse HEAD > build/evaporative-artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaporative-feature-build
          path: |
            build/evaporative-artifacts/
            build/evaporative-*.log
            build/evaporative-renders/
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
            artwork/evaporative_cooler/
            run/server/logs/
          retention-days: 14
          if-no-files-found: error
