name: All-descriptor survival drop audit
on:
  push:
    branches: [qa/survival-runtime-2026-09-08]
    paths: [.github/workflows/playtest-drops.yml, src/main/kotlin/mods/eln/devtest/CampaignDropChecks.kt]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  drops:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - name: Compile all QA probes and retain fixed-core regressions
        run: |
          git rev-parse HEAD > source-commit.txt
          ./gradlew --no-daemon build 2>&1 | tee drop-build.log
      - name: Disposable flat fixture world
        run: |
          mkdir -p run/server
          echo eula=true > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          server-ip=127.0.0.1
          online-mode=false
          gamemode=survival
          spawn-protection=0
          max-tick-time=180000
          level-type=minecraft\:flat
          generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":63}],"biome":"minecraft:plains"}
          EOF
      - name: Break every retained node through survival ServerPlayerGameMode
        env:
          JAVA_TOOL_OPTIONS: '-Deln.campaign=drops'
        run: timeout --signal=TERM --kill-after=30s 10m ./gradlew --no-daemon runServer 2>&1 | tee drop-server.log
      - name: Require complete, nonempty per-descriptor results
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('build/smoke-artifacts/contracts/survival-descriptor-drops.json').read_text())
          assert d['complete'] and d['failures']==0 and len(d['results']) >= 400
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-descriptor-drop-results
          retention-days: 14
          path: |
            source-commit.txt
            drop-*.log
            build/test-results/
            build/smoke-artifacts/
            run/server/world/eln-contracts.json
            run/server/logs/
            run/server/crash-reports/
