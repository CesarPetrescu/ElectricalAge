name: Apply reviewed handoff refinements
on:
  push:
    branches: ['port/1.21.1']
    paths: ['porting/final-handoff.patch.xz', '.github/workflows/eln-finalize-handoff.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/port/1.21.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact reviewed source patch and remove the temporary importer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '4b03e6544327bdaffc67796993428936f686fcfa'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,lzma,subprocess
          raw=lzma.decompress(Path('porting/final-handoff.patch.xz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='7b04f5a8c9a7dc6164d95ee873a508534c382301c14970fc939d39a20a5a2b5a'
          for line in raw.decode().splitlines():
              if line.startswith('+++ ') or line.startswith('--- '):
                  assert line[4:]=='/dev/null' or line[4:].startswith(('a/ports/1.21.1/','b/ports/1.21.1/')),line
          patch=Path('/tmp/eln-final-handoff.patch');patch.write_bytes(raw)
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          PY
          git diff --cached --check
          git rm porting/final-handoff.patch.xz .github/workflows/eln-finalize-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: atomic component restore, stricter regression gates and standalone handoff [skip ci]'
          git push origin HEAD:port/1.21.1
          git rev-parse HEAD
