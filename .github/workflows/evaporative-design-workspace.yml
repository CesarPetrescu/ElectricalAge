name: Evaporative design workspace
on:
  push:
    branches: [design/evaporative-eln-family]
    paths: [.github/workflows/evaporative-design-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/evaporative-source
          git archive --format=zip --output=/tmp/evaporative-source/source.zip HEAD
          git rev-parse HEAD > /tmp/evaporative-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evaporative-design-source
          path: /tmp/evaporative-source
          retention-days: 7
          if-no-files-found: error
