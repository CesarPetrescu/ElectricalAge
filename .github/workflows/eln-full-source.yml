name: ELN full-source 1.21.1 migration
on:
  push:
    branches: ['port/1.21.1-full-source']
    paths: ['ports/1.21.1-full/**', '.github/workflows/eln-full-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eln-full-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migrate:
    if: github.ref == 'refs/heads/port/1.21.1-full-source'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact asset bytes and apply reviewed member migration once
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ports/1.21.1-full/tools -p 'test_*.py' -v
          if [[ ! -f ports/1.21.1-full/migrations/002-members.json ]]; then
            python3 ports/1.21.1-full/tools/restore_binary_assets.py
            python3 ports/1.21.1-full/tools/rewrite_members.py --apply
            python3 ports/1.21.1-full/tools/verify_preservation.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ports/1.21.1-full/src ports/1.21.1-full/reference ports/1.21.1-full/migrations
            git commit -m 'port: migrate original API members and restore binary import integrity [skip ci]'
            git push origin HEAD:refs/heads/port/1.21.1-full-source
          fi
      - name: Record exact source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  compile:
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.migrate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Verify complete original source and resource preservation
        working-directory: ports/1.21.1-full
        run: |
          mkdir -p build/migration
          set -o pipefail
          python3 tools/verify_preservation.py | tee build/migration/preservation.json
      - name: Inspect actual target classpath
        working-directory: ports/1.21.1-full
        run: ./gradlew -I tools/export_api.init.gradle exportMigrationApi --no-daemon --console=plain
      - name: Compile selected migrated inventory and persistence interfaces
        id: api_probe
        continue-on-error: true
        working-directory: ports/1.21.1-full
        run: python3 tools/compile_selected_api.py
      - name: Compile every original active Java and Kotlin source
        working-directory: ports/1.21.1-full
        shell: bash
        run: |
          mkdir -p build/migration
          git rev-parse HEAD > build/migration/source-commit.txt
          python3 tools/compile_report.py --label round3
      - name: Enforce independent API probe
        if: ${{ always() && steps.api_probe.outcome == 'failure' }}
        run: exit 1
      - name: Export compiler report and complete migration project
        if: always()
        working-directory: ports/1.21.1-full
        shell: bash
        run: |
          mkdir -p build/migration
          cat build/migration/round3/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
          git -C ../.. archive --format=zip HEAD:ports/1.21.1-full -o "$PWD/build/full-source-migration.zip"
          python3 -c "import zipfile; z=zipfile.ZipFile('build/full-source-migration.zip'); assert len(z.namelist()) > 4000, 'Incomplete source archive'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-source-migration-evidence
          path: ports/1.21.1-full/build/migration/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-source-migration-project
          path: ports/1.21.1-full/build/full-source-migration.zip
          retention-days: 30
          if-no-files-found: error
