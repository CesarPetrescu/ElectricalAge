name: ELN full-source 1.21.1 migration
on:
  push:
    branches: ['port/1.21.1-full-source']
    paths: ['ports/1.21.1-full/**', '.github/workflows/eln-full-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eln-full-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    if: github.ref == 'refs/heads/port/1.21.1-full-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Record revision, test tooling and verify original-source preservation
        working-directory: ports/1.21.1-full
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/migration
          git rev-parse HEAD | tee build/migration/source-commit.txt
          java -version 2>&1 | tee build/migration/java-version.txt
          python3 -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee build/migration/tool-tests.log
          python3 tools/verify_preservation.py | tee build/migration/preservation.json
      - name: Inspect actual target classpath
        working-directory: ports/1.21.1-full
        run: ./gradlew -I tools/export_api.init.gradle exportMigrationApi --no-daemon --console=plain
      - name: Compile selected migrated inventory and persistence interfaces
        id: api_probe
        continue-on-error: true
        working-directory: ports/1.21.1-full
        run: python3 tools/compile_selected_api.py
      - name: Compile every original active Java and Kotlin source
        working-directory: ports/1.21.1-full
        run: python3 tools/compile_report.py --label checkpoint
      - name: Enforce independent API probe
        if: ${{ always() && steps.api_probe.outcome == 'failure' }}
        run: exit 1
      - name: Export source ledger, compiler report and complete migration project
        if: always()
        working-directory: ports/1.21.1-full
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/migration
          if [[ -f build/migration/checkpoint/diagnostics.json ]]; then
            python3 tools/source_status.py build/migration/checkpoint/diagnostics.json
            cat build/migration/checkpoint/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          git -C ../.. archive --format=zip HEAD:ports/1.21.1-full -o "$PWD/build/full-source-migration.zip"
          python3 -c "import zipfile; z=zipfile.ZipFile('build/full-source-migration.zip'); assert len(z.namelist()) > 4000, 'Incomplete source archive'"
          cp ../../.github/workflows/eln-full-source.yml build/migration/executed-workflow.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-source-migration-evidence
          path: ports/1.21.1-full/build/migration/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-source-migration-project
          path: ports/1.21.1-full/build/full-source-migration.zip
          retention-days: 30
          if-no-files-found: error
