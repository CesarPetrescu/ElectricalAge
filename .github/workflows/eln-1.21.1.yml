name: ELN 1.21.1 port
on:
  push:
    branches: ['port/1.21.1']
    paths: ['ports/1.21.1/**', '.github/workflows/eln-1.21.1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eln-1.21.1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  port:
    if: github.ref == 'refs/heads/port/1.21.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Record exact checked-in source and validate resources
        working-directory: work/ports/1.21.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          git rev-parse HEAD | tee build/evidence/source-commit.txt
          java -version 2>&1 | tee build/evidence/java.txt
          python3 -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee build/evidence/tool-tests.log
          python3 tools/validate_obj.py | tee build/evidence/obj-validation.txt
          python3 tools/validate_resources.py | tee build/evidence/resource-validation.txt
      - name: Compile NeoForge target and execute fresh core regressions
        id: build
        working-directory: work/ports/1.21.1
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :sim-core:cleanTest :sim-core:test build --no-build-cache --no-daemon --stacktrace 2>&1 | tee build/evidence/build.log
          python3 tools/verify.py
      - name: Run real Minecraft GameTests
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: work/ports/1.21.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/gametest
          touch run/gametest/server.properties
          ./gradlew runGameTestServer --no-daemon --stacktrace 2>&1 | tee build/evidence/gametest.log
          python3 tools/verify_gametests.py
      - name: Install headless graphics and audio dependencies
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xserver-utils libgl1-mesa-dri libopenal1 libflite1
      - name: Independent development-client initialization
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: work/ports/1.21.1
        shell: bash
        run: python3 tools/client_smoke.py
      - name: Load the distributable JAR without development classes
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: work/ports/1.21.1
        shell: bash
        run: python3 tools/client_smoke.py --packaged
      - name: Record distributable and complete project source
        if: always()
        working-directory: work/ports/1.21.1
        shell: bash
        run: |
          mkdir -p build/evidence
          git -C ../.. rev-parse HEAD > build/evidence/source-commit.txt
          find build/libs -name '*.jar' -exec sha256sum {} \; > build/evidence/jar-sha256.txt || true
          git -C ../.. archive HEAD:ports/1.21.1 -o "$PWD/build/eln-1.21.1-source.zip"
          git -C ../.. archive HEAD -o "$PWD/build/ElectricalAge-full-project-source.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eln-1.21.1-evidence
          path: |
            work/ports/1.21.1/build/evidence/
            work/ports/1.21.1/sim-core/build/test-results/
            work/ports/1.21.1/sim-core/build/reports/tests/
            work/ports/1.21.1/run/**/logs/
            work/ports/1.21.1/run/**/crash-reports/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build.outcome == 'success' }}
        with:
          name: eln-1.21.1-candidate
          path: |
            work/ports/1.21.1/build/libs/*.jar
            work/ports/1.21.1/build/eln-1.21.1-source.zip
            work/ports/1.21.1/build/ElectricalAge-full-project-source.zip
          retention-days: 30
          if-no-files-found: error
