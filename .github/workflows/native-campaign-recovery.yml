name: Recover native campaign corrections
on:
  push:
    branches: [fix/m1-native-campaign-correctness]
    paths: [.github/workflows/native-campaign-recovery.yml]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: native-campaign-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'CesarPetrescu/ElectricalAge' && github.ref == 'refs/heads/fix/m1-native-campaign-correctness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact prior work, including the two later corrections
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/native-recovery
          python - <<'PY'
          import base64, difflib, hashlib, json, os, pathlib, re, urllib.request
          root = pathlib.Path.cwd()
          out = root / 'build/native-recovery'
          repo = 'CesarPetrescu/ElectricalAge'
          base = '9d59429356b67c7b9952124f9c283231b85d7ef5'
          saved = '94e85db2a723587614796a1191ba8eac57b4d840'
          later = ['acc43b1d9c79fd35d1d4626af4e5653e98fa8fc3', 'bdcff20ee2ce613f2bf2bded5b8c38e4662fcebf']
          def api(path):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'ELN-native-recovery'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def get_tree(ref):
              data = api('git/trees/' + ref + '?recursive=1')
              if data.get('truncated'):
                  raise RuntimeError('Incomplete tree: ' + ref)
              return {e['path']: e for e in data['tree'] if e['type'] == 'blob'}
          def get_blob(sha):
              data = api('git/blobs/' + sha)
              raw = base64.b64decode(data['content'])
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if actual != sha:
                  raise RuntimeError('Blob identity mismatch: ' + sha)
              return raw
          if api('branches/main')['commit']['sha'] != base:
              raise RuntimeError('Main advanced. Rebase/review is required; no automatic overwrite.')
          print((root / 'AGENTS.md').read_text())
          old, new = get_tree(base), get_tree(saved)
          if set(old) - set(new):
              raise RuntimeError('Saved work unexpectedly deletes baseline files')
          changes = {p: e.copy() for p, e in new.items() if p not in old or e['sha'] != old[p]['sha']}
          if not changes:
              raise RuntimeError('Saved corrective tree contains no changes')
          allowed = ('script/', 'docs/testing/', 'src/main/kotlin/mods/eln/devtest/', 'src/test/', '.github/workflows/', 'tools/port/')
          for path in changes:
              if not (path.startswith(allowed) or path == 'build.gradle.kts'):
                  raise RuntimeError('Non-harness change requires manual review: ' + path)
              if '..' in pathlib.PurePosixPath(path).parts:
                  raise RuntimeError('Unsafe path: ' + path)
          content = {p: get_blob(e['sha']) for p, e in changes.items()}
          matches = []
          for sha in later:
              raw = get_blob(sha)
              text = raw.decode('utf-8')
              ranked = sorted((difflib.SequenceMatcher(None, text, value.decode('utf-8'), autojunk=False).ratio(), path) for path, value in content.items())[::-1]
              if ranked[0][0] < 0.70 or (len(ranked) > 1 and ranked[0][0] - ranked[1][0] < 0.20):
                  raise RuntimeError('Ambiguous late correction path: ' + sha + ' ' + repr(ranked[:3]))
              score, path = ranked[0]
              content[path] = raw
              changes[path]['sha'] = sha
              matches.append({'sha': sha, 'path': path, 'similarity': score})
          for path, raw in content.items():
              target = root / path
              if target.is_symlink():
                  raise RuntimeError('Refusing symlink target: ' + path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              if changes[path]['mode'] == '100755':
                  target.chmod(0o755)
          # A token-created commit does not trigger normal push workflows. Permit an
          # explicit branch-only dispatch of the existing full CI after publication.
          ci = root / '.github/workflows/ci.yml'
          text = ci.read_text()
          if not re.search(r'^\s{2}workflow_dispatch\s*:', text, re.M):
              pattern = r'^(on|[\"\x27]on[\"\x27]):\s*$'
              text, count = re.subn(pattern, lambda m: m.group(0) + '\n  workflow_dispatch:', text, count=1, flags=re.M)
              if count != 1:
                  raise RuntimeError('CI trigger format requires manual review')
              ci.write_text(text)
          report = {'base': base, 'recovered_tree': saved, 'files': changes, 'late_corrections': matches,
                    'minecraft_validation': 'pending full CI', 'merged': False}
          (out / 'recovery.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Check recovered Python and native regression tests
        id: local
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib, py_compile, re, subprocess, sys
          root = pathlib.Path.cwd(); out = root / 'build/native-recovery'
          report = json.loads((out / 'recovery.json').read_text())
          for name in report['files']:
              if name.endswith('.py'):
                  py_compile.compile(str(root / name), doraise=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          directories = sorted({str(p.parent.relative_to(root)) for p in (root / 'script').rglob('test_native*.py')})
          if not directories:
              raise RuntimeError('Missing native Python tests; refusing an empty test pass')
          results = []
          for i, directory in enumerate(directories):
              p = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', directory, '-p', 'test_native*.py', '-v'], text=True, capture_output=True, timeout=300)
              log = p.stdout + '\n' + p.stderr
              (out / ('python-tests-' + str(i) + '.log')).write_text(log)
              print(log)
              counts = re.findall(r'Ran (\d+) tests?', log)
              count = int(counts[-1]) if counts else 0
              results.append({'directory': directory, 'exit_code': p.returncode, 'count': count})
          (out / 'python-tests.json').write_text(json.dumps(results, indent=2))
          if any(r['exit_code'] or r['count'] == 0 for r in results):
              raise RuntimeError('Native Python checks failed; the PR must remain draft')
          PY
      - name: Publish recovered source in a draft PR and dispatch full CI
        if: always() && steps.recover.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, subprocess, urllib.request, urllib.error
          root = pathlib.Path.cwd(); out = root / 'build/native-recovery'
          repo = 'CesarPetrescu/ElectricalAge'; branch = 'fix/m1-native-campaign-correctness'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, data=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'ELN-native-recovery'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          # The write-enabled transport is not retained in the proposed changes.
          transport = root / '.github/workflows/native-campaign-recovery.yml'
          transport.unlink()
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          report = json.loads((out / 'recovery.json').read_text())
          paths = list(report['files']) + ['.github/workflows/ci.yml', '.github/workflows/native-campaign-recovery.yml']
          git('add', '--', *paths)
          if git('diff', '--cached', '--name-only'):
              git('commit', '-m', 'test: recover production-native campaign fixes and mechanical hazard assertions')
          commit = git('rev-parse', 'HEAD')
          git('push', 'origin', 'HEAD:refs/heads/' + branch)
          body = '''## Purpose
          Correct the production M1 campaign introduced by PR #10. This recovers the previously uploaded implementation rather than discarding it.

          ## Status
          **Draft, not ready to merge. Full NeoForge and hosted-M1 validation are pending.**
          Local native Python check outcome: **''' + os.environ['LOCAL_OUTCOME'] + '''**. The recovery workflow retains the original test logs and exact blob identities. No test counts from older commits are claimed here.

          ## Recovered scope
          Production-registry consistency, actual 5 V signal/input verification, external battery load versus internal self-discharge, deliberate unsafe rigid-shaft destruction, safe low-speed reconnection, and clutch scenarios. Preserve production shaft mismatch hazards and strict screenshot/report validation.

          ## Source provenance
          Base: `9d59429356b67c7b9952124f9c283231b85d7ef5`.
          Saved tree: `94e85db2a723587614796a1191ba8eac57b4d840`.
          Later blobs: `acc43b1d9c79fd35d1d4626af4e5653e98fa8fc3`, `bdcff20ee2ce613f2bf2bded5b8c38e4662fcebf`.
          Recovery checks every Git blob hash and refuses ambiguous path mapping or moved main.

          ## Merge requirements
          All four M1 suites, Linux control, separate-JVM restart, registry gallery, original screenshots, strict manifest checks, and existing CI must pass on the final revision. This recovery transport removes itself before publication. No merge or release is performed.
          '''
          publication = {'commit': commit, 'branch': branch, 'local_outcome': os.environ['LOCAL_OUTCOME'], 'merged': False}
          try:
              existing = api('pulls?state=open&head=CesarPetrescu:' + branch)
              pr = existing[0] if existing else api('pulls', {'title': 'test: correct M1 native campaigns and validate mechanical mismatch hazards', 'head': branch, 'base': 'main', 'body': body, 'draft': True})
              publication.update({'pr_url': pr['html_url'], 'pr_number': pr['number']})
          except urllib.error.HTTPError as e:
              publication['pr_error'] = str(e)
          try:
              api('actions/workflows/ci.yml/dispatches', {'ref': branch})
              publication['full_ci_dispatched'] = True
          except urllib.error.HTTPError as e:
              publication['ci_dispatch_error'] = str(e)
          (out / 'publication.json').write_text(json.dumps(publication, indent=2))
          print(json.dumps(publication, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Recovered native campaign\n\n```json\n' + json.dumps(publication, indent=2) + '\n```\n\nFull client validation is pending; do not merge yet.\n')
          PY
      - name: Preserve recovery and local-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-campaign-recovery-evidence
          path: build/native-recovery/
          if-no-files-found: error
          retention-days: 14
      - name: Require successful recovery publication
        if: always()
        env:
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('build/native-recovery/publication.json')
          if not p.exists():
              raise SystemExit('Recovery or publication failed; inspect preserved logs')
          data = json.loads(p.read_text())
          if not data.get('pr_url') or not data.get('full_ci_dispatched') or os.environ['LOCAL_OUTCOME'] != 'success':
              raise SystemExit('Draft publication or local checks need attention: ' + json.dumps(data))
          print('Draft PR published and full CI dispatched. Full Minecraft results are still pending.')
          PY
