name: Targeted survival acquisition
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - name: Compile and run fixed-core regressions
        run: |
          git rev-parse HEAD > source-commit.txt
          ./gradlew --no-daemon build 2>&1 | tee acquisition-build.log
      - name: Disposable native server
        run: |
          mkdir -p run/server
          echo eula=true > run/server/eula.txt
          printf 'server-ip=127.0.0.1\nonline-mode=false\ngamemode=survival\nlevel-type=minecraft\\:flat\n' > run/server/server.properties
      - name: Check actual loaded crafting and processing outputs
        env:
          JAVA_TOOL_OPTIONS: '-Deln.campaign=acquisition'
        run: timeout --signal=TERM --kill-after=30s 8m ./gradlew --no-daemon runServer 2>&1 | tee acquisition-server.log
      - name: Require complete six-assertion report
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('build/smoke-artifacts/contracts/survival-acquisition.json').read_text())
          assert d['complete'] and d['failures']==0 and len(d['results'])==6
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-acquisition-results
          retention-days: 14
          path: |
            source-commit.txt
            acquisition-*.log
            build/test-results/
            build/smoke-artifacts/
            run/server/logs/
            run/server/crash-reports/
