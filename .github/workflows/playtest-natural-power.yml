name: Natural-resource fuel-powered wire production
on:
  push:
    branches: [qa/survival-runtime-2026-09-08]
    paths: [.github/workflows/playtest-natural-power.yml, src/main/kotlin/mods/eln/devtest/NaturalPowerInstallation.kt, tools/qa/enable_natural_power.py]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  natural-power:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - name: Compose the hash-checked QA-only power stage and record exact instrumentation
        run: |
          git rev-parse HEAD > source-commit.txt
          python tools/qa/enable_natural_power.py
          git diff -- src/main/kotlin/mods/eln/devtest/NaturalStarterChecks.kt > tested-instrumentation.patch
          sha256sum tested-instrumentation.patch > tested-instrumentation.sha256
          ./gradlew --no-daemon build 2>&1 | tee natural-power-build.log
      - name: Fresh natural terrain and empty survival inventory
        run: |
          mkdir -p run/server
          echo eula=true > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          server-ip=127.0.0.1
          online-mode=false
          gamemode=survival
          difficulty=peaceful
          spawn-protection=0
          max-tick-time=300000
          level-type=minecraft\:normal
          level-seed=12345
          generate-structures=true
          view-distance=5
          simulation-distance=5
          EOF
      - name: Gather and process resources, build a paid platform, burn gathered fuel and make insulated wire
        env:
          JAVA_TOOL_OPTIONS: '-Deln.campaign=nature'
        run: timeout --signal=TERM --kill-after=30s 45m ./gradlew --no-daemon runServer 2>&1 | tee natural-power-server.log
      - name: Require proof of acquired inputs and fuel-paid output
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('build/smoke-artifacts/contracts')
          d=json.loads((root/'natural-survival-starter.json').read_text())
          p=json.loads((root/'natural-powered-production.json').read_text())
          j=json.loads((root/'natural-starter-journal.json').read_text())
          assert d['complete'] and d['failures']==0 and p['complete']
          assert p['peakTurbineVoltage']>1 and p['peakTurbineOutputWatts']>.01 and p['fuelRemaining']<4
          assert any(x['action']=='natural-powered-wire-production-complete' for x in j)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural-powered-production-results
          retention-days: 14
          path: |
            source-commit.txt
            tested-instrumentation.*
            natural-power-*.log
            build/test-results/
            build/smoke-artifacts/
            run/server/logs/
            run/server/crash-reports/
            run/server/world/level.dat
            run/server/world/region/
            run/server/world/data/
