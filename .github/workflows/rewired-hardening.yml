name: Re-Wired hardening
on:
  push:
    branches: [ci/rewired-hardening-20260905]
    paths: ['porting/**', '.github/workflows/rewired-hardening.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rewired-hardening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PORT_VERSION: 2.0.0-alpha.2-hardening.4
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
        with: {path: harness}
      - uses: actions/checkout@v4
        with:
          repository: brambora69123/electrical-age-rewired
          ref: 3a0088b384aa4111c3a7f984d4cbc5f4ff142ed9
          path: rewired
          fetch-depth: 0
      - name: Apply pinned and checksummed patches
        working-directory: rewired
        run: |
          mkdir -p audit-results
          git apply --check ../harness/porting/patches/0001-fix-dedicated-server-client-state.patch
          git apply ../harness/porting/patches/0001-fix-dedicated-server-client-state.patch
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          bundles=[('01',4,'caa659b879735d96b310abd6b457648638e8cb639c7720974f5e472b7a6c3f98'),('02',2,'65fa358c6f540fcdfcfdad1320c96f2f038ba916cd9dfb15d1df25cd0a490112'),('03',1,'1caa0bef70741a91171f9ea6ed70513a1358753404e918a25b87cb3f4ec54bef'),('04',1,'6b9cea699289f36a1554e2615341d1b47694fbd6fc756941638c3f642380f333')]
          for key,count,sha in bundles:
              files=sorted(Path('../harness/porting/bundles').glob('hardening-'+key+'.xz.b64.part*'))
              assert len(files)==count
              data=base64.b64decode(''.join(p.read_text().strip() for p in files),validate=True)
              assert hashlib.sha256(data).hexdigest()==sha, 'Bundle checksum mismatch: '+key
              patch=Path('audit-results/hardening-'+key+'.patch');patch.write_bytes(lzma.decompress(data))
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
          PY
          git diff --check
          git rev-parse HEAD > audit-results/upstream-commit.txt
      - name: Static resource rescan
        working-directory: rewired
        run: python3 tools/audit_resources.py --json audit-results/resources.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            rewired/*.gradle
            rewired/gradle.properties
            rewired/gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xserver-utils mesa-utils imagemagick
      - name: Prepare Forge workspace
        working-directory: rewired
        shell: bash
        run: |
          set -o pipefail
          java -version 2>&1 | tee audit-results/java.log
          ./gradlew --version 2>&1 | tee audit-results/gradle.log
          ./gradlew setupDecompWorkspace --no-daemon --stacktrace 2>&1 | tee audit-results/workspace.log
      - name: Regression suite
        working-directory: rewired
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test --no-daemon --stacktrace -PportVersion="$PORT_VERSION" 2>&1 | tee audit-results/test.log
          python3 tools/verify_test_results.py
      - name: Candidate build and separate runtime fixture
        id: build
        working-directory: rewired
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build validationJar --no-daemon --stacktrace -PportVersion="$PORT_VERSION" 2>&1 | tee audit-results/build.log
      - name: Dedicated server placement, capability and save probe
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: rewired
        run: python3 tools/smoke_test.py server --accept-eula --label first --validation --version "$PORT_VERSION"
      - name: Reload and verify persisted nodes and inventory NBT
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: rewired
        run: python3 tools/smoke_test.py server --accept-eula --label reload --validation --version "$PORT_VERSION"
      - name: Independent client model and tooltip validation
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: rewired
        run: xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/smoke_test.py client --label first --validation --version "$PORT_VERSION"
      - name: Package source and patch evidence
        if: always()
        working-directory: rewired
        run: |
          git add -N src tools build.gradle gradle.properties
          git diff --check
          git diff --stat > audit-results/source-diff-stat.txt
          git diff --binary > audit-results/complete-source.patch
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          with zipfile.ZipFile('audit-results/rewired-hardening-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('.').rglob('*')):
                  if not p.is_file() or set(p.parts) & {'.git','.gradle','build','run','audit-results'}: continue
                  z.write(p, 'rewired-hardening/'+p.as_posix())
          paths=list(Path('build/libs').glob('*.jar'))
          Path('audit-results/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in paths))
          PY
      - name: Upload full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewired-hardening-results
          path: |
            rewired/audit-results/
            rewired/build/test-results/
            rewired/build/reports/tests/
            rewired/run/**/crash-reports/
          retention-days: 30
      - name: Upload candidate binaries
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rewired-hardening-jars
          path: rewired/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
