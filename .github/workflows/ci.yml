name: CI

# The 1.21.1 port's whole test surface, on every push and pull request:
#   build     compiles, runs the 300-odd unit tests under NeoForge's JUnit launcher, uploads the jar
#   benchmark the MNA benchmark tests (failures fail the job; statistics as an artifact)
#   smoke     the in-world runs of tools/port/smoke.sh: a headless dedicated server places every
#             descriptor and the test circuits, restarts against the saved world, then a headless
#             client (Xorg on the dummy driver + Mesa llvmpipe) joins it and screenshots everything.
#             Screenshots and logs are uploaded whether it passes or not.
# See tools/port/headless.md for what each run checks and how to run them locally.

on:
  push:
    branches: ["main", "port/**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let an active release finish; the publisher skips commits superseded on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release publisher
        run: bash script/test-publish-latest.sh
      - name: Build and test
        run: ./gradlew build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          if-no-files-found: error
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  benchmark:
    name: MNA benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run benchmark tests
        run: |
          set -o pipefail
          mkdir -p build/benchmark-artifacts
          ./gradlew benchmarkTest 2>&1 | tee build/benchmark-artifacts/benchmark-gradle.log
      - name: Extract benchmark statistics
        if: always()
        run: python3 script/extract_benchmark_stats.py
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          if-no-files-found: warn
          path: |
            build/benchmark-artifacts/**
            build/test-results/benchmarkTest/**
            build/reports/tests/benchmarkTest/**

  smoke:
    name: In-world smoke (${{ matrix.integration }})
    strategy:
      fail-fast: false
      matrix:
        integration: [standalone, create]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISPLAY: ":99"
      WITH_CREATE: ${{ matrix.integration == 'create' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Headless X server with software GL
        # LWJGL 3 needs an X display and a GL 3.2 core context; Xorg on the dummy driver plus
        # Mesa's llvmpipe (GL 4.5) is enough, and is the setup tools/port/headless.md documents.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xserver-xorg-video-dummy xserver-xorg-core x11-xserver-utils libgl1-mesa-dri mesa-utils
          sudo tee /tmp/dummy.conf >/dev/null <<'EOF'
          Section "Monitor"
            Identifier "Monitor0"
            HorizSync 28.0-90.0
            VertRefresh 48.0-80.0
          EndSection
          Section "Device"
            Identifier "Card0"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Screen"
            Identifier "Screen0"
            Device "Card0"
            Monitor "Monitor0"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1280x1024" "1024x768"
              Virtual 1280 1024
            EndSubSection
          EndSection
          EOF
          sudo nohup Xorg :99 -config /tmp/dummy.conf -logfile /tmp/xorg.log -noreset -nolisten tcp -ac > /tmp/xorg.stdout 2>&1 &
          for i in $(seq 1 30); do xset -display :99 q >/dev/null 2>&1 && break; sleep 1; done
          xset -display :99 q >/dev/null
          glxinfo -B | grep -E "OpenGL (renderer|core profile version)"

      - name: Run directories
        # What headless.md sets up by hand: the server's eula and a flat world, the client's
        # options (a fresh profile stops on the accessibility onboarding screen otherwise).
        run: |
          mkdir -p run/server run/client
          echo eula=true > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          online-mode=false
          max-tick-time=-1
          level-type=minecraft\:flat
          generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":63}],"biome":"minecraft:plains"}
          EOF
          printf 'onboardAccessibility:false\nnarrator:0\n' > run/client/options.txt

      - name: Smoke runs
        run: tools/port/smoke.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-runs-${{ matrix.integration }}
          if-no-files-found: warn
          path: |
            build/smoke-artifacts/**
            run/client/screenshots/**
            run/client/logs/latest.log
            run/server/logs/latest.log
            run/client/crash-reports/**
            run/server/crash-reports/**
            /tmp/xorg.log

  release:
    name: Publish latest 1.21.1 mod
    needs: [build, benchmark, smoke]
    if: >-
      github.repository == 'CesarPetrescu/ElectricalAge' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: release-input
      - name: Publish tested JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish-latest.sh
