name: CI

# The 1.21.1 port's whole test surface, on every push and pull request:
#   build     compiles, runs the unit tests under NeoForge's JUnit launcher, uploads the jar
#   benchmark the MNA benchmark tests (failures fail the job; statistics as an artifact)
#   smoke     real dedicated server, saved-world restart and software-rendered Linux client
#   multiplayer tests the packaged JAR on a dedicated server with two separate real clients
#   native-client hosted M1 functional campaigns, catalogue captures and separate JVM restart
# See tools/port/headless.md and docs/testing/native-client-campaigns.md.

on:
  push:
    branches: ["main", "port/**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Full per-block gallery and repeated restart checks
        type: boolean
        default: false
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.extended) && 'extended' || 'regular' }}
  # Let an active release finish; the publisher skips commits superseded on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release publisher
        run: bash script/test-publish-latest.sh
      - name: Check block-report gate
        run: python3 script/test_block_contracts.py
      - name: Check multiplayer result gate
        run: python3 script/test_multiplayer.py
      - name: Check ore-generation result gate
        run: python3 script/test_ore_worldgen.py
      - name: Build and test
        run: ./gradlew build
      - name: Verify survival recipe data matches its declarations
        run: |
          ./gradlew --no-daemon runData
          python3 - <<'PY'
          import json, pathlib, subprocess
          for item in ('wire_snips', 'polarized_shaft_generator', 'polarized_shaft_motor'):
              for folder in ('recipe', 'advancement/recipes/misc'):
                  path = f'src/generated/resources/data/eln/{folder}/{item}.json'
                  committed = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}']))
                  generated = json.loads(pathlib.Path(path).read_text())
                  assert committed == generated, f'Stale generated recipe data: {path}'
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          if-no-files-found: error
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  benchmark:
    name: MNA benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run benchmark tests
        run: |
          set -o pipefail
          mkdir -p build/benchmark-artifacts
          ./gradlew benchmarkTest 2>&1 | tee build/benchmark-artifacts/benchmark-gradle.log
      - name: Extract benchmark statistics
        if: always()
        run: python3 script/extract_benchmark_stats.py
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          if-no-files-found: warn
          path: |
            build/benchmark-artifacts/**
            build/test-results/benchmarkTest/**
            build/reports/tests/benchmarkTest/**

  smoke:
    name: In-world smoke (${{ matrix.integration }})
    strategy:
      fail-fast: false
      matrix:
        integration: [standalone, create]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISPLAY: ":99"
      WITH_CREATE: ${{ matrix.integration == 'create' && '1' || '0' }}
      ELN_FULL_GALLERY: ${{ (github.event_name == 'schedule' || inputs.extended) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Headless X server with software GL
        # LWJGL 3 needs an X display and a GL 3.2 core context; Xorg on the dummy driver plus
        # Mesa's llvmpipe (GL 4.5) is enough, and is the setup tools/port/headless.md documents.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xserver-xorg-video-dummy xserver-xorg-core x11-xserver-utils libgl1-mesa-dri mesa-utils
          sudo tee /tmp/dummy.conf >/dev/null <<'EOF'
          Section "Monitor"
            Identifier "Monitor0"
            HorizSync 28.0-90.0
            VertRefresh 48.0-80.0
          EndSection
          Section "Device"
            Identifier "Card0"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Screen"
            Identifier "Screen0"
            Device "Card0"
            Monitor "Monitor0"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1280x1024" "1024x768"
              Virtual 1280 1024
            EndSubSection
          EndSection
          EOF
          sudo nohup Xorg :99 -config /tmp/dummy.conf -logfile /tmp/xorg.log -noreset -nolisten tcp -ac > /tmp/xorg.stdout 2>&1 &
          for i in $(seq 1 30); do xset -display :99 q >/dev/null 2>&1 && break; sleep 1; done
          xset -display :99 q >/dev/null
          glxinfo -B | grep -E "OpenGL (renderer|core profile version)"

      - name: Run directories
        # Fresh profiles otherwise stop at the accessibility onboarding screen.
        run: |
          mkdir -p run/server run/client
          echo eula=true > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          online-mode=false
          max-tick-time=-1
          level-type=minecraft\:flat
          generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":63}],"biome":"minecraft:plains"}
          EOF
          printf 'onboardAccessibility:false\nnarrator:0\n' > run/client/options.txt

      - name: Smoke runs
        run: tools/port/smoke.sh

      - name: Validate and summarize block contracts
        if: always()
        run: python3 script/check_block_contracts.py --client

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-runs-${{ matrix.integration }}
          if-no-files-found: warn
          path: |
            build/smoke-artifacts/**
            run/client/screenshots/**
            run/client/logs/latest.log
            run/server/logs/latest.log
            run/client/crash-reports/**
            run/server/crash-reports/**
            /tmp/xorg.log

  compatibility:
    name: Companion mod contracts
    uses: ./.github/workflows/compatibility.yml

  evaporative:
    name: Evaporative cooler contracts
    uses: ./.github/workflows/evaporative-cooler.yml

  wire-thermal:
    name: Wire overload contracts
    uses: ./.github/workflows/wire-thermal.yml

  multiplayer:
    name: Packaged multiplayer contracts
    needs: build
    uses: ./.github/workflows/multiplayer.yml

  ore-worldgen:
    name: Natural ore generation contracts
    needs: build
    uses: ./.github/workflows/ore-worldgen.yml

  survival:
    name: Survival material and recipe contracts
    uses: ./.github/workflows/playtest-survival.yml

  acquisition:
    name: Survival acquisition contracts
    uses: ./.github/workflows/playtest-acquisition.yml

  menus:
    name: Native menu resize contracts
    uses: ./.github/workflows/playtest-all-menus.yml

  overhead:
    name: Overhead support rendering
    uses: ./.github/workflows/playtest-overhead.yml

  natural-power:
    name: Natural resource powered production
    uses: ./.github/workflows/playtest-natural-power.yml

  native-client:
    name: M1 native client component campaigns
    uses: ./.github/workflows/native-client-campaign.yml

  release:
    name: Publish latest 1.21.1 mod
    needs: [build, benchmark, smoke, compatibility, evaporative, wire-thermal, multiplayer, ore-worldgen, survival, acquisition, menus, overhead, natural-power, native-client]
    if: >-
      github.repository == 'CesarPetrescu/ElectricalAge' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.extended))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: release-input
      - name: Publish tested JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish-latest.sh
