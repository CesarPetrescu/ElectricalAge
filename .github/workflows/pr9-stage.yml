name: PR9 guarded source publication
on:
  pull_request:
    types: [synchronize, reopened]
    paths: ['tools/pr9-stage.patch.gz', '.github/workflows/pr9-stage.yml']
permissions:
  contents: read
jobs:
  publish-and-test:
    if: github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/converter-floating-topology'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Apply only the hash-checked source patch to the unchanged PR branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5038e3e70b4cdffc14dd062f4f53a38ac82437aa'
          test "$(git ls-remote origin refs/heads/fix/converter-floating-topology | cut -f1)" = "$EXPECTED_HEAD"
          gzip -dc tools/pr9-stage.patch.gz > /tmp/pr9-source.patch
          echo '32d89171be4057f491e51fc0d5460779c54ae50b264db467e0774364353251b3  /tmp/pr9-source.patch' | sha256sum -c -
          git apply --check /tmp/pr9-source.patch
          git apply --index /tmp/pr9-source.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: solve parallel converter limits conservatively and regress overload recovery'
          git push origin HEAD:refs/heads/fix/converter-floating-topology
          mkdir -p build/pr9-publication
          git rev-parse HEAD > build/pr9-publication/source-commit.txt
          git diff HEAD^ HEAD > build/pr9-publication/source.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the actual mod and run production controller and topology regressions
        run: |
          set -o pipefail
          ./gradlew --no-daemon test --tests 'mods.eln.sim.power.ParallelConverterRuntimeTest' --tests 'mods.eln.sim.power.ConverterTopologyRegressionTest' --tests 'mods.eln.sim.power.ConverterMnaTest' 2>&1 | tee build/pr9-publication/gradle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr9-controller-publication
          if-no-files-found: error
          path: |
            build/pr9-publication/**
            build/test-results/test/**
            build/reports/tests/test/**
