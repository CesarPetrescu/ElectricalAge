plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = mod_version
group = 'mods.eln'
base { archivesName = 'eln-full-source-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
kotlin { jvmToolchain(21) }
repositories { mavenCentral() }
dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
    testImplementation platform('org.junit:junit-bom:5.10.5')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
def generateVersion = tasks.register('generateVersion', Copy) {
    from 'src/main/resources/Version.java'
    into layout.buildDirectory.dir('generated/version/mods/eln/misc')
    expand(MAJORVERSION: '0', MINORVERSION: '0', REVISION: '0', VERSION_STRING: project.version)
}
sourceSets {
    main {
        java {
            setSrcDirs(['src/main/java', 'src/main/kotlin'])
            srcDir layout.buildDirectory.dir('generated/version')
            exclude '**/Eln_old.java'
        }
        kotlin {
            setSrcDirs(['src/main/java', 'src/main/kotlin'])
            srcDir layout.buildDirectory.dir('generated/version')
        }
        resources {
            srcDir 'src/main/resources'
            exclude 'Version.java', 'mcmod.info', 'pack.mcmeta', '**/*.blend', '**/*.blend1', '**/*.psd'
        }
    }
    test {
        java { setSrcDirs(['src/test/java']) }
        kotlin { setSrcDirs(['src/test/kotlin']) }
    }
}
tasks.named('compileKotlin') { dependsOn generateVersion }
tasks.named('compileJava') {
    dependsOn generateVersion
    options.compilerArgs += ['-Xmaxerrs', '10000', '-Xmaxwarns', '1000']
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
neoForge {
    version = project.neo_version
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
    }
    mods { eln { sourceSet sourceSets.main } }
}
// Explicit release gate; current compilation also fails on genuine source errors.
tasks.register('releaseParityGate') {
    doLast { throw new GradleException('Full-source port is not release-ready. See MIGRATION.md and compiler reports.') }
}
